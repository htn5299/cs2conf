//mouse
bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "mouse4" "+voicerecord"
bind "mouse5" "player_ping"
bind "mwheelup" "slot5"
bind "mwheeldown" "+jump"

//binds
bind "q" "lastinv"
bind "w" "+forward"
bind "e" "+use"
bind "r" "+reload"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "g" "drop"
bind "z" "+showscores"
bind "t" "+spray_menu"
bind "escape" "cancelselect"
bind "del" "mute"
bind "pause" "pause"
bind "shift" "+sprint"
bind "ctrl" "+duck"
bind "space" "+jump"
bind "\" "toggleconsole"
bind "h" "toggle r_fullscreen_gamma 2.3 2.9"
bind "n" "+lookatweapon"
bind "k" "toggle volume 0.04 0.4"
bind "l" "switchhands"
bind "b" "buymenu"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "7" "slot9"
bind "f" "slot7"
bind "x" "slot11"
bind "c" "slot8"
bind "v" "slot10"

//rate + hud commands
fps_max "999"
cl_showfps "0"
cl_teamid_overhead_mode "3"
cl_showloadout "1"
cl_use_opens_buy_menu "0"
cl_hide_avatar_images "2"
cl_silencer_mode "0"
viewmodel_presetpos "2"
hud_showtargetid "0"
r_fullscreen_gamma "2.2"
r_drawtracers_firstperson "1"
cl_hud_telemetry_frametime_show "2"
cl_disable_ragdolls 0
cl_predict_kill_ragdolls 0
rate "786432"
safezonex "0.65"

//settings
cl_radar_scale "0.65"
r_fullscreen_gamma "2.6"
r_show_build_info "false"
voice_always_sample_mic "0"
voice_modenable "1"
voice_threshold "2000"
cl_prefer_lefthanded "true"
cl_sanitize_player_names "false"
cl_allow_animated_avatars "0"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_hud_telemetry_ping_show "2"
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_net_misdelivery_show "2"
cl_mute_all_but_friends_and_party "0"
cl_mute_enemy_team "0"
ui_steam_overlay_notification_position "bottomright"

//sounds
snd_headphone_eq "0"
snd_spatialize_lerp "0.5"
snd_steamaudio_enable_perspective_correction "0"
snd_mixahead "0.011"
snd_tensecondwarning_volume "0.05"
snd_menumusic_volume "0"
snd_mapobjective_volume "0"
snd_deathcamera_volume "0"
snd_mvp_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_roundstart_volume "0"
volume "0.01"

alias "_lock" "gameui_preventescapetoshow"
alias "_unlock" "gameui_allowescapetoshow"

echo "loaded cs2conf.cfg!"
